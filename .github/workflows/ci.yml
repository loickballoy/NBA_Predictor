name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the C++ model
        run: |
          make -C model
          make -C model test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Le job complet tourne sur un bucket local (file://) avec les binaires compilés ci-dessus.
      - name: Python tests
        run: pytest -q
